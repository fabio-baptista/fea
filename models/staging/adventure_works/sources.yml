version: 2

sources:
  - name: adw_raw
    description: "Fontes brutas (raw) do dataset AdventureWorks no Databricks."
    database: fea_academy
    schema: adventure_works

    tables:
      - name: sales_customer
        description: "Tabela fonte de clientes (Customer)."
        columns:
          - name: customerid
            description: "Identificador do cliente."

      - name: person_person
        description: "Tabela fonte de pessoas (Person)."
        columns:
          - name: businessentityid
            description: "Identificador da pessoa (BusinessEntityID)."

      - name: production_product
        description: "Tabela fonte de produtos (Product)."
        columns:
          - name: productid
            description: "Identificador do produto."

      - name: person_address
        description: "Tabela fonte de endereços (Address)."
        columns:
          - name: addressid
            description: "Identificador do endereço."

      - name: person_stateprovince
        description: "Tabela fonte de estado/província (StateProvince)."
        columns:
          - name: stateprovinceid
            description: "Identificador do estado/província."

      - name: person_countryregion
        description: "Tabela fonte de país/região (CountryRegion)."

      - name: sales_creditcard
        description: "Tabela fonte de cartões de crédito (CreditCard)."
        columns:
          - name: creditcardid
            description: "Identificador do cartão de crédito."

      - name: sales_salesorderheader
        description: "Tabela fonte de cabeçalho de pedidos de venda (SalesOrderHeader)."
        columns:
          - name: salesorderid
            description: "Identificador do pedido de venda."

      - name: sales_salesorderdetail
        description: "Tabela fonte de itens do pedido de venda (SalesOrderDetail)."
        columns:
          - name: salesorderdetailid
            description: "Identificador do item do pedido (SalesOrderDetailID)."
          - name: salesorderid
            description: "Identificador do pedido de venda (SalesOrderID)."
          - name: productid
            description: "Identificador do produto (ProductID)."

      - name: sales_salesreason
        description: "Tabela fonte de motivos de venda (SalesReason)."
        columns:
          - name: salesreasonid
            description: "Identificador do motivo de venda (SalesReasonID)."

      - name: sales_salesorderheadersalesreason
        description: "Tabela ponte pedido x motivo de venda (SalesOrderHeaderSalesReason)."
        columns:
          - name: salesorderid
            description: "Identificador do pedido de venda (SalesOrderID)."
          - name: salesreasonid
            description: "Identificador do motivo de venda (SalesReasonID)."