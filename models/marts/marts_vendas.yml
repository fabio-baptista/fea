version: 2

models:
  - name: fct_vendas
    description: "Fato de vendas (grão: 1 linha por item do pedido)."
    columns:
      - name: sk_venda_item
        description: "Chave técnica única do item de venda."
        tests:
          - not_null
          - unique
      - name: pk_salesorder
        description: "ID do pedido de venda."
      - name: pk_salesorderdetail
        description: "ID do detalhe do pedido."
      - name: fk_product
        description: "ID do produto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produtos')
                field: pk_product
      - name: fk_customer
        description: "ID do cliente."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: pk_customer
      - name: fk_address
        description: "ID do endereço."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locais')
                field: pk_address
      - name: fk_creditcard
        description: "ID do cartão."
        tests:
          - relationships:
              arguments:
                to: ref('dim_cartoes')
                field: pk_creditcard
      - name: data_pedido
        description: "Data e hora do pedido."
      - name: data_pedido_date
        description: "Data do pedido (formato date)."
      - name: ano
        description: "Ano do pedido."
      - name: mes
        description: "Mês do pedido."
      - name: status_pedido
        description: "Status do pedido."
      - name: quantidade_pedida
        description: "Quantidade pedida do item."
      - name: preco_unitario
        description: "Preço unitário do produto."
      - name: desconto_unitario
        description: "Desconto unitário aplicado."
      - name: valor_bruto_item
        description: "Valor bruto do item (quantidade * preço)."
      - name: valor_desconto_item
        description: "Valor do desconto do item."
      - name: valor_liquido_item
        description: "Valor líquido do item (bruto - desconto)."

  - name: dim_produtos
    description: "Dimensão de produtos."
    columns:
      - name: pk_product
        description: "Chave primária do produto."
        tests:
          - not_null
          - unique
      - name: nome_produto
        description: "Nome do produto."

  - name: dim_clientes
    description: "Dimensão de clientes."
    columns:
      - name: pk_customer
        description: "Chave primária do cliente."
        tests:
          - not_null
          - unique
      - name: fk_person
        description: "ID da pessoa associada."
      - name: fk_store
        description: "ID da loja associada."
      - name: nome_cliente
        description: "Nome do cliente ou da loja."

  - name: dim_locais
    description: "Dimensão de endereços/localidade."
    columns:
      - name: pk_address
        description: "Chave primária do endereço."
        tests:
          - not_null
          - unique
      - name: nome_cidade
        description: "Nome da cidade."
      - name: pk_stateprovince
        description: "ID do estado/província."
      - name: nome_estado
        description: "Nome do estado."
      - name: nome_pais
        description: "Nome do país."

  - name: dim_cartoes
    description: "Dimensão de cartões de crédito."
    columns:
      - name: pk_creditcard
        description: "Chave primária do cartão."
        tests:
          - not_null
          - unique
      - name: tipo_cartao
        description: "Tipo do cartão (ex: Vista, SuperiorCard)."

  - name: dim_motivos_vendas
    description: "Dimensão de motivos de venda."
    columns:
      - name: pk_salesreason
        description: "Chave primária do motivo."
        tests:
          - not_null
          - unique
      - name: nome_motivo_venda
        description: "Nome do motivo."
      - name: tipo_motivo_venda
        description: "Tipo do motivo."

  - name: dim_pedidos
    description: "Dimensão de pedidos de venda (nível cabeçalho)."
    columns:
      - name: pk_salesorder
        description: "Chave primária do pedido."
        tests:
          - not_null
          - unique
      - name: data_pedido
        description: "Data do pedido."
      - name: fk_customer
        description: "ID do cliente."
      - name: fk_address
        description: "ID do endereço de cobrança."
      - name: fk_creditcard
        description: "ID do cartão utilizado."
      - name: status_pedido
        description: "Status do pedido."
      - name: subtotal_valor
        description: "Subtotal do pedido."
      - name: imposto_valor
        description: "Valor do imposto."
      - name: frete_valor
        description: "Valor do frete."
      - name: total_valor
        description: "Valor total do pedido."
