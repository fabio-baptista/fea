version: 2

models:
  - name: fct_vendas
    description: "Fato de vendas (grão: 1 linha por item do pedido)."
    columns:
      - name: sk_venda_item
        description: "Chave técnica única do item de venda."
        tests:
          - not_null
          - unique

      # === Relationships (FKs do fato -> PKs das dimensões) ===

      - name: fk_product
        description: "Produto da venda."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produtos')
                field: pk_product

      - name: fk_customer
        description: "Cliente associado ao pedido."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: pk_customer

      - name: fk_address
        description: "Endereço de cobrança associado ao pedido (BillTo)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locais')
                field: pk_address

      - name: fk_creditcard
        description: "Cartão utilizado no pedido."
        tests:
          - relationships:
              arguments:
                to: ref('dim_cartoes')
                field: pk_creditcard

      - name: pk_salesorder
        description: "Identificador do pedido de venda (SalesOrderID)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pedidos')
                field: pk_salesorder

  - name: dim_produtos
    description: "Dimensão de produtos."
    columns:
      - name: pk_product
        description: "Chave primária do produto."
        tests:
          - not_null
          - unique

  - name: dim_clientes
    description: "Dimensão de clientes."
    columns:
      - name: pk_customer
        description: "Chave primária do cliente."
        tests:
          - not_null
          - unique
      - name: fk_person
        description: "Chave para a pessoa associada ao cliente (Person.Person). Pode ser nulo quando o cliente é uma loja (Store)."
      - name: fk_store
        description: "Chave para a loja associada ao cliente (Store). Pode ser nulo quando o cliente é uma pessoa (Person)."
      - name: nome_cliente
        description: "Nome do cliente exibível para análise (derivado de Person quando existir; caso contrário, associado à Store)."

  - name: dim_locais
    description: "Dimensão de endereços/localidade (cidade/estado/país)."
    columns:
      - name: pk_address
        description: "Chave primária do endereço."
        tests:
          - not_null
          - unique

  - name: dim_cartoes
    description: "Dimensão de cartões de crédito."
    columns:
      - name: pk_creditcard
        description: "Chave primária do cartão."
        tests:
          - not_null
          - unique

  - name: dim_motivos_vendas
    description: "Dimensão de motivos de venda."
    columns:
      - name: pk_salesreason
        description: "Chave primária do motivo de venda."
        tests:
          - not_null
          - unique

  - name: dim_pedidos
    description: "Dimensão de pedidos de venda."
    columns:
      - name: pk_salesorder
        description: "Chave primária do pedido (SalesOrderID)."
        tests:
          - not_null
          - unique

  - name: agg_ticket_medio_mes
    description: "Tabela agregada mensal com faturamento bruto, descontos, total negociado e ticket médio (total negociado / número de pedidos)."
    columns:
      - name: mes
        description: "Mês de referência (primeiro dia do mês)."
        tests:
          - not_null

      - name: numero_pedidos
        description: "Quantidade de pedidos distintos no mês."
        tests:
          - not_null

      - name: faturamento_bruto
        description: "Soma do valor bruto dos itens no mês."
        tests:
          - not_null

      - name: descontos
        description: "Soma do valor de descontos dos itens no mês."
        tests:
          - not_null

      - name: total_negociado
        description: "Soma do valor líquido (bruto - descontos) no mês."
        tests:
          - not_null

      - name: ticket_medio
        description: "Ticket médio do mês: total negociado / número de pedidos."