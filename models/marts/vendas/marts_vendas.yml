version: 2

models:
  - name: dim_clientes
    description: "Dimensão de clientes."
    columns:
      - name: pk_customer
        description: "Chave primária do cliente."
        tests:
          - not_null
          - unique

  - name: dim_locais
    description: "Dimensão de locais."
    columns:
      - name: pk_address
        description: "Chave primária de endereço."
        tests:
          - not_null
          - unique

  - name: dim_cartoes
    description: "Dimensão de cartões."
    columns:
      - name: pk_creditcard
        description: "Chave primária do cartão."
        tests:
          - not_null
          - unique

  - name: dim_produtos
    description: "Dimensão de produtos."
    columns:
      - name: pk_product
        description: "Chave primária do produto."
        tests:
          - not_null
          - unique

  - name: dim_motivos_vendas
    description: "Dimensão de motivos de venda."
    columns:
      - name: pk_salesreason
        description: "Chave primária do motivo."
        tests:
          - not_null
          - unique

  - name: dim_pedidos
    description: "Dimensão de pedidos (1 linha por pedido)."
    columns:
      - name: pk_salesorder
        description: "Chave primária do pedido."
        tests:
          - not_null
          - unique

  - name: bridge_pedido_motivo_venda
    description: "Tabela ponte entre pedido e motivo."
    columns:
      - name: pk_salesorder
        description: "Pedido na bridge."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pedidos')
                field: pk_salesorder

      - name: pk_salesreason
        description: "Motivo na bridge."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_motivos_vendas')
                field: pk_salesreason

  - name: fct_vendas
    description: "Fato de vendas no grão de item de pedido."
    columns:
      - name: sk_venda_item
        description: "Chave surrogate do item."
        tests:
          - not_null
          - unique

      - name: pk_salesorder
        description: "Pedido do item."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pedidos')
                field: pk_salesorder

      - name: fk_customer
        description: "Cliente da venda."
        tests:
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: pk_customer

      - name: fk_address
        description: "Endereço da venda."
        tests:
          - relationships:
              arguments:
                to: ref('dim_locais')
                field: pk_address

      - name: fk_creditcard
        description: "Cartão da venda."
        tests:
          - relationships:
              arguments:
                to: ref('dim_cartoes')
                field: pk_creditcard

      - name: fk_product
        description: "Produto da venda."
        tests:
          - relationships:
              arguments:
                to: ref('dim_produtos')
                field: pk_product
